[package]
name = "kizurium-native"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Optional grayscale tile reductions for Kizurium Translator"

[lib]
name = "kizurium_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py311"] }

[profile.release]
lto = "thin"
codegen-units = 1
